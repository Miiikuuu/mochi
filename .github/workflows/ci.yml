name: Public Source CI
on: [push, pull_request]
jobs:
  public-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-pil gir1.2-gtk-4.0 xvfb x11-utils fonts-noto-cjk libdbus-1-dev pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev
      - run: sh scripts/public-ci.sh
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-source-acceptance
          path: |
            target/public-manager/
            target/spine-rejection.log
